name: Fetch Latest News

on:
  workflow_dispatch:
    inputs:
      news_batch:
        description: "Select news batch to fetch"
        required: true
        default: "F1"
        type: choice
        options:
          - F1
          - F2
          - F3

  schedule:
    # F1: 10:30 AM IST = 05:00 UTC
    - cron: "0 5 * * *"

    # F2: 6:30 PM IST = 13:00 UTC
    - cron: "0 13 * * *"

    # F3: 10:30 PM IST = 17:00 UTC
    - cron: "0 17 * * *"

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: functions
        run: npm install

      - name: Set news batch
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_BATCH: ${{ inputs.news_batch }}
        run: |
          if [ -n "$MANUAL_BATCH" ]; then
            echo "NEWS_BATCH=$MANUAL_BATCH" >> "$GITHUB_ENV"
            echo "Manual batch selected: $MANUAL_BATCH"

          elif [ "$SCHEDULE" = "0 5 * * *" ]; then
            echo "NEWS_BATCH=F1" >> "$GITHUB_ENV"
            echo "Scheduled batch: F1"

          elif [ "$SCHEDULE" = "0 13 * * *" ]; then
            echo "NEWS_BATCH=F2" >> "$GITHUB_ENV"
            echo "Scheduled batch: F2"

          elif [ "$SCHEDULE" = "0 17 * * *" ]; then
            echo "NEWS_BATCH=F3" >> "$GITHUB_ENV"
            echo "Scheduled batch: F3"

          else
            echo "NEWS_BATCH=" >> "$GITHUB_ENV"
            echo "No batch selected"
          fi

      - name: Fetch news
        working-directory: functions
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEWS_BATCH: ${{ env.NEWS_BATCH }}
        run: node fetch-news.js
