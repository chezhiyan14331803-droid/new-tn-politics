name: Fetch Latest News

on:
  workflow_dispatch:
    inputs:
      news_batch:
        description: "Select news batch to fetch"
        required: true
        default: "AUTO"
        type: choice
        options:
          - AUTO
          - F1
          - F2
          - F3

  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: functions
        run: npm install

      - name: Set news batch
        shell: bash
        env:
          MANUAL_BATCH: ${{ inputs.news_batch }}
        run: |

          if [ "$MANUAL_BATCH" = "F1" ]; then

            echo "NEWS_BATCH=F1" >> "$GITHUB_ENV"

            echo "Manual batch selected: F1"

          elif [ "$MANUAL_BATCH" = "F2" ]; then

            echo "NEWS_BATCH=F2" >> "$GITHUB_ENV"

            echo "Manual batch selected: F2"

          elif [ "$MANUAL_BATCH" = "F3" ]; then

            echo "NEWS_BATCH=F3" >> "$GITHUB_ENV"

            echo "Manual batch selected: F3"

          else

            echo "NEWS_BATCH=AUTO" >> "$GITHUB_ENV"

            echo "Automatic batch selection enabled"

          fi

      - name: Fetch news
        working-directory: functions
        env:

          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}

          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          NEWS_BATCH: ${{ env.NEWS_BATCH }}

        run: node fetch-news.js