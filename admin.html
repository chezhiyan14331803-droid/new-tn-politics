<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin | New TN Politics</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            <span>NEW TN</span>
            <strong>POLITICS</strong>
        </div>

        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="reader.html">
                Today's News
            </a>

        </nav>

    </header>


    <!-- ADMIN LOGIN -->

    <main class="admin-page">

        <div class="admin-container">

            <div class="admin-heading">

                <p class="section-label">
                    ADMINISTRATION
                </p>

                <h1>
                    Admin Login
                </h1>

                <p>
                    Login to manage New TN Politics
                    daily news.
                </p>

            </div>


            <form id="adminLoginForm"
                  class="admin-form">

                <div class="form-group">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required>

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required>

                </div>


                <button
                    type="submit"
                    class="admin-login-button">

                    Login

                </button>


                <p id="loginMessage"
                   class="login-message">
                </p>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="logo">

            <span>NEW TN</span>
            <strong>POLITICS</strong>

        </div>

        <p>
            Admin Panel
        </p>

    </footer>


    
    <script type="module" src="admin-auth.js"></script>

</body>

</html>
