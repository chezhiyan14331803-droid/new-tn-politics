<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Today's News | Daily News Updates</title>
    <meta
    name="description"
    content="Read the latest Daily News Updates."
>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            <span>DAILY NEWS</span>
<strong>UPDATES</strong>
        </div>


        <nav class="navbar">

            <a href="index.html">Home</a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#previous">
                Previous News
            </a>

        </nav>


        <button class="search-button"
                onclick="openSearch()">

            🔍 Search

        </button>

    </header>


    <!-- PAGE CONTENT -->

    <main class="reader-page">


        <!-- BACK BUTTON -->

        <a href="index.html"
           class="back-button">

            ← Back to Home

        </a>


        <!-- NEWS TITLE -->

        <div class="reader-heading">

            <p class="section-label">
                DAILY NEWS
            </p>
            <h1 id="readerTitle">
               Loading news...
            </h1>

            <p class="reader-date" id="readerDate">
                Loading news...
            </p>

            

        </div>
      <!-- NEWS DESCRIPTION -->

<div
    id="readerDescription"
    class="reader-description"
>
    Loading news...
</div>

        <!-- PDF VIEWER -->

        <div class="pdf-container">

            <iframe
              id="readerPdf"
              title="Today's News PDF">
            </iframe>

        </div>


        <!-- ACTION BUTTONS -->

        <div class="reader-actions">

            <a
               id="readerDownload"
               href="#"
               target="_blank"
               class="reader-download">

               ↓ Download PDF

            </a>


            <button
                onclick="shareNews()"
                class="reader-share">

                ↗ Share

            </button>

        </div>
        <!-- ================= READER ACTIONS & ENGAGEMENT ================= -->
<div class="reader-engagement">

    <!-- WhatsApp & Social Sharing -->
    <button class="share-btn whatsapp-share" id="whatsappShareBtn" type="button">
        💬 Share on WhatsApp
    </button>

    <!-- General Native Web Share -->
    <button class="share-btn native-share" id="nativeShareBtn" type="button">
        ↗ Share Article
    </button>

    <!-- Text to Speech Audio Player -->
    <button class="audio-btn" id="audioNewsBtn" type="button">
        🔊 Listen to News
    </button>

</div>


    </main>


    <!-- FOOTER -->

    <footer class="footer">
    <a href="index.html" class="logo-link" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
    <img src="logo.png" alt="Daily News Updates Logo" style="height: 48px; width: auto; object-fit: contain;">
</a>

    <p>Your daily source for Tamil Nadu news and updates.</p>

    <div class="footer-links" style="margin: 15px 0; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
        <a href="privacy.html" style="color: #6b7280; text-decoration: none;">Privacy Policy</a>
        <a href="terms.html" style="color: #6b7280; text-decoration: none;">Terms of Service</a>
        <a href="disclaimer.html" style="color: #6b7280; text-decoration: none;">Disclaimer</a>
    </div>

    <p class="copyright">
        © 2026 New TN Politics. All rights reserved.
    </p>
</footer>


    <!-- SEARCH POPUP -->

    <div class="search-popup"
         id="searchPopup">

        <div class="search-box">

            <button
                class="close-search"
                onclick="closeSearch()">

                ×

            </button>
            <button
    class="theme-button"
    id="themeButton"
    onclick="toggleDarkMode()"
    aria-label="Toggle dark mode"
>
    🌙
</button>


            <h2>
                Search News
            </h2>


            <input
                type="text"
                id="searchInput"
                placeholder="Search for news...">


            <button onclick="searchNews()">

                Search

            </button>

        </div>

    </div>


    <script src="script.js"></script>
    <script type="module" src="reader-news.js?v=2"></script>

</body>

</html>
