<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>News Snippets — Quick Updates</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Top Navigation Header */
        .reels-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .reels-header a {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Vertical Fullscreen Reel Container */
        .reels-container {
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .reels-container::-webkit-scrollbar {
            display: none;
        }

        /* Single Snippet Card */
        .snippet-card {
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 80px 24px 40px 24px;
            background-size: cover;
            background-position: center;
        }

        .snippet-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.95) 100%);
            z-index: 1;
        }

        .snippet-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .snippet-badge {
            display: inline-block;
            background: #e63946;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .snippet-title {
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .snippet-description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .snippet-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .read-full-btn {
            flex: 1;
            background: #ffffff;
            color: #111111;
            padding: 14px 20px;
            border-radius: 30px;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .read-full-btn:active {
            transform: scale(0.97);
        }

        .share-icon-btn {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swipe-indicator {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 4px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -6px); }
            60% { transform: translate(-50%, -3px); }
        }
    </style>
</head>
<body>

    <div class="reels-header">
        <a href="index.html">✕ Close</a>
        <span style="font-size: 0.9rem; font-weight: 600; color: #e63946;">⚡ NEWS REELS</span>
        <div style="width: 50px;"></div>
    </div>

    <div class="swipe-indicator">
        <span>👆 Swipe up for next story</span>
    </div>

    <div class="reels-container" id="reelsContainer">
        <!-- Dynamically rendered snippet slides -->
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: #888;">
            Loading news reels...
        </div>
    </div>

    <script type="module" src="snippets-news.js"></script>
</body>
</html>
